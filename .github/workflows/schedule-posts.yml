name: Publish posts scheduled for today

on:
  schedule:
    # Run every day at 23:30 UTC or manually run
    - cron: "30 23 * * *"
  workflow_dispatch:

# contents: push the moved posts; actions: start the deploy (a push made with GITHUB_TOKEN does not trigger other workflows)
permissions:
  contents: write
  actions: write

jobs:
  publish_scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get the date for today
        id: date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Check for scheduled posts and move to posts
        run: |
          echo "Today is $TODAY"
          shopt -s nullglob
          mkdir -p _posts
          for file in _scheduled/${TODAY}-*.md; do
            echo "Found scheduled: $file"
            mv "$file" "_posts/"
            echo "Moved $file to _posts/"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _posts/
          git add _scheduled/
          if git commit -m "Posted Scheduled Drafts on $TODAY"; then
            git push
            echo "PUBLISHED=true" >> $GITHUB_ENV
          else
            echo "No changes to commit"
          fi

      - name: Deploy the site
        if: env.PUBLISHED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
