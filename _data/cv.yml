cv:
  name: Arthur R. C. McCray
  label: Postdoctoral Scholar, Stanford University
  email: arthurmccray95@gmail.com
  location: San Francisco Bay Area, CA
  website: https://arthurmccray.github.io
  summary: >
    Research scientist working at the intersection of machine learning and electron microscopy. I build self-supervised and
    physics-informed methods for inverse problems in scientific imaging (deep generative priors, implicit neural representations, and
    differentiable forward models) and ship them as open-source tools used across the field. I am currently developing multimodal vision
    transformer foundation models for electron microscopy, pretrained on large simulated diffraction datasets together with crystal structure
    and composition, as part of a $1.2M Deep Material Priors program with Toyota Research Institute. Earlier work produced >10× faster and
    40% higher-resolution ptychographic reconstructions and is being transferred into semiconductor metrology workflows.

