    Experience:
      - company: Stanford University
        position: "Postdoctoral Scholar: Ophus Group"
        location: Stanford, CA
        start_date: 2024-09
        highlights:
          - Proposed and demonstrated a self-supervised deep-prior framework for solving inverse problems in (S)TEM, now a reusable approach underpinning projects in ptychography, tomography, and crystallography. Supervise extensions of the method by three graduate students and two postdocs, with collaborations at SLAC, UC Berkeley, and the Technion.
          - Initiated and led the first application of this framework to electron ptychography, achieving a >10× speedup and 40% resolution improvement over state-of-the-art ML and iterative baselines.
          - Led the technical contributions behind a $1.2M award from Toyota Research Institute for Deep Material Priors, a program building physics-aware foundation models for materials characterization. Now developing its multimodal vision transformer models (diffraction, structure, and composition encoders with a fusion backbone), pretrained with masked autoencoding on large simulated datasets using distributed (DDP/FSDP) training.
          - Developed whole-pattern-fitting methods for improved strain mapping, now being adopted for semiconductor metrology workflows at Samsung.
          - Created [quantEM](https://github.com/electronmicroscopy/quantem), an open-source library for quantitative electron microscopy, and lead its ptychography and machine learning development.

      - company: Lawrence Berkeley National Laboratory
        position: "Postdoctoral Scholar: National Center for Electron Microscopy (NCEM)"
        location: Berkeley, CA
        start_date: 2024-02
        end_date: 2024-09
        highlights:
          - Developed machine learning methods for 4D-STEM analysis in the group of Colin Ophus; continued the same research program upon the group's move to Stanford.

      - company: Argonne National Laboratory / Northwestern University
        position: "Graduate Research Assistant: Petford-Long and Phatak Groups"
        location: IL
        start_date: 2018
        end_date: 2023
        highlights:
          - Built a simulation and training pipeline for Lorentz TEM neural networks, enabling large-scale statistical studies of spin textures.
          - Developed a self-supervised method for quantitative magnetic phase imaging from a single image, replacing the conventional through-focal series.
          - Authored [PyLorentz](https://github.com/PyLorentz/PyLorentz), an open-source Python package for Lorentz TEM simulation and phase reconstruction now widely used in the magnetic-microscopy community.
          - Designed and ran cryogenic and in-situ TEM experiments on van der Waals magnets.
          - Collaborated across 10+ groups at national labs and universities, contributing analysis and imaging expertise to publications.

    Open Source Projects:
      - name: "quantEM: core developer and package creator"
        url: https://github.com/electronmicroscopy/quantem
        highlights:
          - Open-source Python library for quantitative electron microscopy.
          - Developed the ptychography and machine learning modules; contributed core infrastructure (data structures, visualization, utilities, configuration) and [tutorials](https://github.com/electronmicroscopy/quantem-tutorials).

      - name: "PyLorentz: sole developer and maintainer"
        url: https://github.com/PyLorentz/PyLorentz
        highlights:
          - Widely adopted Python codebase for Lorentz TEM simulation, phase reconstruction, and ML-based analysis.
          - Sole author and maintainer since 2020, covering architecture, documentation, releases, and user support.

